<svg xmlns="http://www.w3.org/2000/svg" class="jf-svg" focusable="false" viewBox="0 0 400 470" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <linearGradient id="jf-shell" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e8ede9"/><stop offset="1" stop-color="#c3cdc6"/></linearGradient>
  <linearGradient id="jf-back" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#d3dcd6"/><stop offset="1" stop-color="#97a69e"/></linearGradient>
  <radialGradient id="jf-scr" cx=".35" cy=".3" r=".9">
