name: release
# Builds Joe's installers: Windows (.exe), Mac (.dmg, Apple Silicon + Intel) and Linux
# (.AppImage, x86_64 + aarch64). Push a tag like v2.0.0 to publish a GitHub release with them
# and one SHA256SUMS.txt (the names update.py looks for). "Run workflow" by hand builds them as
# downloadable test files, no release. Mac and Linux are newer: if one of them fails, the
# release still goes out with whatever built (Windows must pass).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read          # the build jobs only read; the release job below may write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - name: Version
        id: v
        run: |
          code=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('joeai/__init__.py').read()).group(1))")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            [ "$tag" = "$code" ] || { echo "::error::tag v$tag doesn't match joeai/__init__.py ($code)"; exit 1; }
          fi
          echo "version=$code" >> "$GITHUB_OUTPUT"

      - name: Private Python (python-build-standalone, checked against its SHA256SUMS)
        run: |
          rel=$(gh release view --repo astral-sh/python-build-standalone --json tagName,assets)
          name=$(echo "$rel" | jq -r '.assets[].name' | grep -E '^cpython-3\.12\.[0-9]+\+[0-9]+-x86_64-pc-windows-msvc-install_only\.tar\.gz$' | head -1)
          [ -n "$name" ] || { echo "::error::no Windows Python build found"; exit 1; }
          tag=$(echo "$rel" | jq -r .tagName)
          mkdir -p pbs && cd pbs
          gh release download "$tag" --repo astral-sh/python-build-standalone -p "$name" -p SHA256SUMS
          want=$(grep " $name\$" SHA256SUMS | cut -d' ' -f1)
          got=$(sha256sum "$name" | cut -d' ' -f1)
          [ -n "$want" ] && [ "$want" = "$got" ] || { echo "::error::checksum mismatch for $name"; exit 1; }
          tar -xzf "$name"
          echo "Using $name"

      - name: Gather Joe's files
        run: |
          d=build/windows
          mkdir -p "$d"
          cp -r joeai docs Joe.pyw README.md LICENSE THIRD_PARTY.md "$d"/
          cp -r pbs/python "$d"/python
          find "$d/joeai" -name "__pycache__" -prune -exec rm -rf {} +
          rm -f "$d/joeai/_install.json"
          printf '{"kind": "windows-installer", "version": "%s"}\n' "${{ steps.v.outputs.version }}" > "$d/joeai/_install.json"
          "$d/python/python.exe" -c "import ssl, sqlite3, json, urllib.request; print('python ok')"
          JOE_OFFLINE=1 "$d/python/python.exe" -c "import sys; sys.path.insert(0, '$d'); import joeai.server, joeai.update; print('joe imports ok', joeai.update.install_kind())"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$v" "/DSourceDir=..\build\windows" "/DOutputName=Joe-Setup-$v-windows-x64" installer\joe.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checksums
        run: cd dist && sha256sum Joe-Setup-*.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Silent install test
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\Joe-Setup-*.exe | Select-Object -First 1
          $dir = "$env:RUNNER_TEMP\JoeTest"
          # -Wait would also wait for the Joe the installer opens at the end, so wait on setup itself
          $env:JOE_NO_WINDOW = "1"
          $p = Start-Process $exe.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/DIR=$dir","/TASKS=" -PassThru
          if (-not $p.WaitForExit(600000)) { throw "installer took over 10 min" }
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          Start-Sleep 5
          Get-Process pythonw -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Test-Path "$dir\python\pythonw.exe")) { throw "pythonw.exe missing after install" }
          if (-not (Test-Path "$dir\joeai\_install.json")) { throw "_install.json missing" }
          & "$dir\python\python.exe" -c "import sys; sys.path.insert(0, r'$dir'); import joeai.update as u; assert u.install_kind() == 'windows-installer'; print('installed ok')"
          $u = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -PassThru
          [void]$u.WaitForExit(300000)
          Start-Sleep 5
          if (Test-Path "$dir\joeai") { throw "uninstall left program files" }

      - uses: actions/upload-artifact@v6
        with:
          name: joe-windows
          path: dist/*

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64, triple: aarch64-apple-darwin }
          - { runner: macos-15-intel, arch: x64, triple: x86_64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Version
        id: v
        run: echo "version=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('joeai/__init__.py').read()).group(1))")" >> "$GITHUB_OUTPUT"
      - name: Private Python
        run: installer/get_python.sh ${{ matrix.triple }}
      - name: Build Joe.app and the disk image
        run: installer/mac/build_dmg.sh ${{ steps.v.outputs.version }} ${{ matrix.arch }}
      - name: Install test (copy out of the disk image, start, quit)
        run: |
          dmg=$(ls dist/Joe-*-macos-*.dmg)
          mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | cut -f3-)
          test -f "$mnt/Read me first.txt"
          cp -R "$mnt/Joe.app" "$RUNNER_TEMP/Joe.app"
          hdiutil detach "$mnt"
          codesign --verify --deep --strict "$RUNNER_TEMP/Joe.app"
          python3 installer/smoke_test.py mac-app -- "$RUNNER_TEMP/Joe.app/Contents/MacOS/Joe"
          # Joe never writes inside his own app (that would break the signature)
          codesign --verify --deep --strict "$RUNNER_TEMP/Joe.app"
      - uses: actions/upload-artifact@v6
        with:
          name: joe-mac-${{ matrix.arch }}
          path: dist/*.dmg

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64, triple: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, arch: aarch64, triple: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Version
        id: v
        run: echo "version=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('joeai/__init__.py').read()).group(1))")" >> "$GITHUB_OUTPUT"
      - name: Private Python
        run: installer/get_python.sh ${{ matrix.triple }}
      - name: Build the AppImage
        run: installer/linux/build_appimage.sh ${{ steps.v.outputs.version }} ${{ matrix.arch }}
      - name: Install test (start, quit)
        run: |
          img=$(ls dist/Joe-*-linux-*.AppImage)
          APPIMAGE_EXTRACT_AND_RUN=1 python3 installer/smoke_test.py linux-appimage -- "$img"
      - uses: actions/upload-artifact@v6
        with:
          name: joe-linux-${{ matrix.arch }}
          path: dist/*.AppImage

  release:
    if: always() && github.ref_type == 'tag' && needs.windows.result == 'success'
    needs: [windows, mac, linux]
    permissions:
      contents: write       # only this job publishes the release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: got
          pattern: joe-*
          merge-multiple: true
      - name: Checksums for every file
        run: |
          mkdir dist && find got -type f ! -name '*.txt' -exec cp {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS.txt
          # the version goes inside the signed list: Joe won't install an older signed release offered as new
          echo "# joe-ai version ${GITHUB_REF_NAME#v}" >> SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/checkout@v6
        with:
          path: src
      - name: Sign the checksum list (Joe checks it before installing an update)
        env:
          JOE_SIGNING_KEY: ${{ secrets.JOE_SIGNING_KEY }}
        run: |
          if [ -n "$JOE_SIGNING_KEY" ]; then
            python3 src/installer/sign_release.py dist/SHA256SUMS.txt
          else
            echo "::warning::The JOE_SIGNING_KEY secret isn't set, so this release isn't signed."
          fi
      - name: Publish release
        run: |
          v="${GITHUB_REF_NAME#v}"
          cat > notes.md <<NOTES
          **Windows:** download Joe-Setup-$v-windows-x64.exe and open it. It isn't code-signed yet, so Windows SmartScreen may say "Windows protected your PC" (or pause and say it "couldn't be reached"): click More info, then Run anyway.

          **Mac:** download the .dmg for your Mac (arm64 = Apple Silicon M1/M2/M3/M4, x64 = older Intel Macs), open it and drag Joe onto Applications. The first time, macOS can't check Joe: Apple charges developers \$99 every year to remove that warning, and Joe is free, so we don't pay it. Click Done, then System Settings > Privacy & Security > Open Anyway. Details are in "Read me first.txt" inside the disk image.

          **Linux:** download the .AppImage (x86_64 for most PCs, aarch64 for ARM), make it runnable (right-click > Properties > Allow executing, or chmod +x) and open it.

          SHA256SUMS.txt lets you check any download; SHA256SUMS.txt.sig (when there) proves the list came from Joe's maker, and Joe checks it before he installs an update. If a Mac or Linux file is missing, that build failed this time; the next release will try again.
          NOTES
          if [ -f src/installer/RELEASE_NOTES.md ]; then cat src/installer/RELEASE_NOTES.md notes.md > all.md; else cp notes.md all.md; fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # re-run after a failed build: add the missing files and the new checksum list
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Joe $GITHUB_REF_NAME" \
              --notes-file all.md \
              $( [[ "$GITHUB_REF_NAME" == *dev* || "$GITHUB_REF_NAME" == *rc* ]] && echo --prerelease )
          fi
