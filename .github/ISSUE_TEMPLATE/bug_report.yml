name: 🐞 Bug report
description: Something in Joe isn't working right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Your PC (OS, graphics card, RAM)
      placeholder: e.g. Windows 11, RTX 4070, 32 GB RAM
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Joe version
      description: Shown at the top right of Joe's window
      placeholder: e.g. 2.0.0
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: "A help file makes this much easier: Setup > System check > MAKE A HELP FILE. It hides your keys, home folder and user name, and never holds your files, chats or recordings. Look inside before attaching it."
