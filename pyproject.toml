[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "joe-ai"
version = "2.3.0.dev27"
description = "Joe (01000001 01001001): overnight grunt work on your own PC with local AI models"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11.4"
dependencies = []

[project.scripts]
joe-ai = "joeai.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["joeai"]

[tool.setuptools.package-data]
joeai = ["model_picks.json", "ui/*.html", "ui/*.js", "ui/*.css", "ui/*.svg", "ui/sounds/*.wav", "ui/fonts/*.ttf", "ui/fonts/*.txt", "ui/fonts/*.css", "packs/*.txt", "lang/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 200

[tool.ruff.lint]
select = ["F", "E9", "PLE"]

[tool.ruff.lint.per-file-ignores]
# tests import fixtures by name (F401) and then take them as arguments (F811)
"tests/*" = ["F401", "F811"]
