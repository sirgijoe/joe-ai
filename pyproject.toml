[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joe-ai"
version = "2.0.0.dev77"
description = "Joe (01000001 01001001): overnight grunt work on your own PC with local AI models"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
joe-ai = "joeai.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["joeai"]

[tool.setuptools.package-data]
joeai = ["ui/*.html", "ui/*.js", "ui/*.css", "ui/sounds/*.wav", "ui/fonts/*.ttf", "ui/fonts/*.txt", "ui/fonts/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
